<!DOCTYPE html>
<html lang="de" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blind-Ranking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:#0c0e14; --surface:#13161f; --surface2:#1b1f2c; --surface3:#222737;
    --gold:#d4a843; --gold-hi:#f0c355; --gold-dim:#8a6d2a;
    --gold-bg:rgba(212,168,67,0.08); --gold-border:rgba(212,168,67,0.25);
    --text:#eef0f5; --text2:#9098ac; --text3:#4e566a;
    --radius:8px; --radius-lg:12px;
  }
  html,body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:flex-start; justify-content:center; padding:2.5rem 1rem 5rem; }
  .stage { width:100%; max-width:580px; position:relative; }
  .stage::before { content:''; position:absolute; top:-1px; left:0; right:0; height:3px; background:linear-gradient(90deg,transparent,var(--gold),var(--gold-hi),var(--gold),transparent); border-radius:99px; z-index:1; }
  .card { background:var(--surface); border-radius:var(--radius-lg); border:1px solid rgba(255,255,255,0.06); padding:2rem 1.75rem; }
  .brand { display:flex; align-items:center; gap:10px; margin-bottom:0.3rem; }
  .crown { font-size:22px; line-height:1; }
  h1 { font-family:'Oswald',sans-serif; font-size:26px; font-weight:700; color:var(--text); letter-spacing:0.04em; text-transform:uppercase; }
  .desc { font-size:13px; color:var(--text2); margin-bottom:1.75rem; line-height:1.6; padding-left:32px; }
  label { font-size:11px; font-weight:500; text-transform:uppercase; letter-spacing:.09em; color:var(--text3); display:block; margin-bottom:7px; }
  .field { margin-bottom:1.5rem; }
  
  input[type="text"] { 
    width: 100%; height: 42px; padding: 0 14px; 
    background: var(--surface2); 
    border: 1px solid rgba(255,255,255,0.07); 
    border-radius: var(--radius); 
    color: var(--text); font-size: 14px; font-family:'Inter',sans-serif; 
    outline: none; transition: border-color .15s, box-shadow .15s; 
  }
  input::placeholder { color:var(--text3); }
  input:focus { border-color:var(--gold-border); box-shadow:0 0 0 3px rgba(212,168,67,0.1); }
  
  button { display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:9px 18px; border-radius:var(--radius); border:1px solid rgba(255,255,255,0.1); background:transparent; color:var(--text2); font-size:13px; font-family:'Inter',sans-serif; font-weight:500; cursor:pointer; transition:background .15s,border-color .15s,color .15s; }
  button:hover:not(:disabled) { background:var(--surface2); color:var(--text); border-color:rgba(255,255,255,0.15); }
  button:disabled { opacity:0.3; cursor:default; }
  
  .btn-primary { background:var(--gold)!important; color:#0c0e14!important; border-color:var(--gold)!important; font-weight:600!important; font-size:14px!important; padding:12px 24px!important; }
  .btn-primary:hover:not(:disabled) { background:var(--gold-hi)!important; border-color:var(--gold-hi)!important; }
  .btn-sm { font-size:12px; padding:6px 12px; }
  
  .divider { margin:1.5rem 0; border:none; border-top:1px solid rgba(255,255,255,0.06); }
  .back-btn { font-size:12px; color:var(--text3); margin-bottom:1.25rem; display:inline-flex; align-items:center; gap:5px; cursor:pointer; background:none; border:none; padding:0; }
  .back-btn:hover { color:var(--text2); }

  /* lang bar */
  .lang-bar { display:flex; gap:8px; justify-content:flex-end; margin-bottom:15px; }
  .lb { padding:5px 12px; font-size:11px; font-weight:600; font-family:'Inter',sans-serif; color:var(--text3); border:1px solid rgba(255,255,255,0.1); border-radius:6px; background:transparent; cursor:pointer; transition:0.15s; letter-spacing:0.05em; }
  .lb:hover { color:var(--text2); border-color:rgba(255,255,255,0.2); }
  .lb.active { color:var(--gold); border-color:var(--gold-border); background:var(--gold-bg); }

  /* home */
  .mode-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:1.75rem; }
  .mode-card { background:var(--surface2); border:1px solid rgba(255,255,255,0.07); border-radius:var(--radius-lg); padding:1.5rem 1.25rem; text-align:center; cursor:pointer; transition:background .15s,border-color .15s,transform .1s; }
  .mode-card:hover { background:var(--gold-bg); border-color:var(--gold-border); transform:translateY(-2px); }
  .mode-icon { font-size:32px; margin-bottom:.6rem; }
  .mode-title { font-family:'Oswald',sans-serif; font-size:17px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; color:var(--text); margin-bottom:.3rem; }
  .mode-desc { font-size:12px; color:var(--text3); line-height:1.5; }

  /* items/slots */
  .item-row { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .num { font-family:'Oswald',sans-serif; font-size:15px; font-weight:700; color:var(--gold); width:20px; text-align:center; flex-shrink:0; }
  .rm-btn { width:42px; height:42px; flex-shrink:0; background:var(--surface2); border:1px solid rgba(255,255,255,0.07); border-radius:var(--radius); color:var(--text3); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:0.15s; padding:0; }
  .rm-btn:hover { background:rgba(255,255,255,0.05); color:var(--text2); }
  
  .slots-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-bottom:1.5rem; }
  .slot { aspect-ratio:1; border:2px dashed rgba(255,255,255,0.12); border-radius:var(--radius); background:var(--surface2); display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; position:relative; overflow:hidden; transition:border-color .15s,background .15s; }
  .slot:hover,.slot.drag-over { border-color:var(--gold-border); background:var(--gold-bg); }
  .slot.filled { border-style:solid; border-color:rgba(255,255,255,0.1); cursor:default; }
  .slot .plus { font-size:22px; color:var(--text3); margin-bottom:4px; }
  .slot .slot-num { font-family:'Oswald',sans-serif; font-size:11px; color:var(--text3); letter-spacing:0.05em; }
  .slot img { width:100%; height:100%; object-fit:cover; display:block; }
  .slot .remove-btn { position:absolute; top:4px; right:4px; width:20px; height:20px; border-radius:50%; background:rgba(0,0,0,0.75); color:#fff; font-size:11px; border:none; padding:0; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:background .12s; }
  .slot .remove-btn:hover { background:rgba(180,40,40,0.9); }
  .slot .label-overlay { position:absolute; bottom:0; left:0; right:0; background:linear-gradient(transparent,rgba(0,0,0,0.78)); padding:14px 4px 4px; }
  .slot .label-input { width:100%; height:auto; background:transparent; border:none; color:#fff; font-size:10px; font-family:'Inter',sans-serif; text-align:center; outline:none; padding:0 2px; }
  .slot .label-input::placeholder { color:rgba(255,255,255,0.4); }

  /* link boxes */
  .link-box { margin-top:1.5rem; background:var(--gold-bg); border:1px solid var(--gold-border); border-radius:var(--radius-lg); padding:1.25rem 1.5rem; display:none; }
  .link-section { margin-bottom:1rem; }
  .link-section:last-child { margin-bottom:0; }
  .link-section .lbl { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.1em; color:var(--gold-dim); margin-bottom:6px; }
  .url-row { display:flex; gap:8px; align-items:center; }
  .url-display { flex:1; padding:10px 12px; border:1px solid rgba(255,255,255,0.08); border-radius:var(--radius); font-size:13px; color:var(--text2); background:var(--surface); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-family:monospace; user-select:all; cursor:pointer; transition:border-color .15s; }
  .url-display:hover { border-color:var(--gold-border); color:var(--text); }
  .copy-btn { font-size:13px; padding:10px 14px; white-space:nowrap; flex-shrink:0; font-weight:600; background:var(--gold)!important; color:#0c0e14!important; border-color:var(--gold)!important; border-radius:var(--radius); cursor:pointer; display:inline-flex; align-items:center; gap:5px; transition:background .12s; }
  .copy-btn:hover { background:var(--gold-hi)!important; }
  .copy-btn.copied { background:#1a3a20!important; border-color:#2d6e3a!important; color:#5ecf7a!important; }
  .sep { height:1px; background:rgba(255,255,255,0.08); margin:1rem 0; }
  .err-box { margin-top:1rem; background:rgba(160,40,40,0.15); border:1px solid rgba(160,40,40,0.35); border-radius:var(--radius); padding:.75rem 1rem; font-size:13px; color:#e07070; display:none; }

  /* spinner */
  .spinner { display:inline-block; width:14px; height:14px; border:2px solid rgba(12,14,20,0.3); border-top-color:#0c0e14; border-radius:50%; animation:spin .7s linear infinite; flex-shrink:0; }
  .spinner-light { border-color:rgba(255,255,255,0.15); border-top-color:var(--text2); }
  @keyframes spin { to { transform:rotate(360deg); } }
  .loading-screen { text-align:center; padding:3rem 1rem; }
  .loading-screen .sp { display:block; width:26px; height:26px; border-width:3px; margin:0 auto 1rem; }
  .loading-screen p { font-size:14px; color:var(--text2); }

  /* game */
  .sub { font-size:12px; color:var(--text3); letter-spacing:.06em; text-transform:uppercase; margin-bottom:1.75rem; font-weight:500; }
  .intro-box { background:var(--surface2); border-left:3px solid var(--gold); border-radius:0 var(--radius) var(--radius) 0; padding:1rem 1.25rem; margin-bottom:1.75rem; font-size:14px; line-height:1.7; color:var(--text2); }
  .pw { display:flex; align-items:center; gap:10px; margin-bottom:1.5rem; }
  .pb { flex:1; height:2px; background:var(--surface3); border-radius:99px; overflow:hidden; }
  .pf { height:100%; background:var(--gold); border-radius:99px; transition:width .4s ease; }
  .pl { font-family:'Oswald',sans-serif; font-size:13px; color:var(--text3); white-space:nowrap; letter-spacing:0.05em; }
  .ic { background:var(--surface2); border:1px solid rgba(255,255,255,0.06); border-radius:var(--radius-lg); padding:1.5rem; margin-bottom:1.25rem; text-align:center; position:relative; overflow:hidden; }
  .ic::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,transparent,var(--gold),transparent); }
  .ic .lb { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.12em; color:var(--text3); margin-bottom:10px; }
  .ic .nm { font-family:'Oswald',sans-serif; font-size:28px; font-weight:700; color:var(--text); letter-spacing:0.02em; line-height:1.2; }
  .ic .ht { font-size:12px; color:var(--text3); margin-top:8px; }
  .sl { font-size:13px; color:var(--text2); margin-bottom:10px; }
  .sg { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-bottom:1.5rem; }
  .s { background:var(--surface2); border:1px solid rgba(255,255,255,0.06); border-radius:var(--radius); padding:10px 4px; text-align:center; cursor:pointer; transition:background .12s,border-color .12s,transform .1s; }
  .s:hover:not(.tk) { background:var(--gold-bg); border-color:var(--gold-border); transform:translateY(-2px); }
  .s.tk { opacity:.25; cursor:default; }
  .s .rk { font-family:'Oswald',sans-serif; font-size:20px; font-weight:700; color:var(--text); letter-spacing:0.04em; }
  .s:hover:not(.tk) .rk { color:var(--gold); }
  .s .sn { font-size:9px; color:var(--text3); margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .s .fr { font-size:10px; color:var(--text3); margin-top:3px; }
  .hi { font-size:12px; color:var(--text3); line-height:2; }
  .hi strong { color:var(--text2); font-family:'Oswald',sans-serif; letter-spacing:0.03em; }
  .img-card { background:var(--surface2); border:1px solid rgba(255,255,255,0.06); border-radius:var(--radius-lg); overflow:hidden; margin-bottom:1.25rem; position:relative; }
  .img-card::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,transparent,var(--gold),transparent); }
  .img-card .img-wrap { width:100%; max-height:300px; display:flex; align-items:center; justify-content:center; background:#0a0c10; }
  .img-card .img-wrap img { width:100%; max-height:300px; object-fit:contain; display:block; }
  .img-card .img-label { padding:10px 14px 4px; font-size:14px; color:var(--text); font-weight:500; text-align:center; }
  .img-card .img-hint { padding:0 14px 10px; font-size:12px; color:var(--text3); text-align:center; }
  .rank-row { display:flex; gap:8px; margin-bottom:1.5rem; }
  .rb { flex:1; aspect-ratio:1; background:var(--surface2); border:1px solid rgba(255,255,255,0.06); border-radius:var(--radius); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; cursor:pointer; transition:background .12s,border-color .12s,transform .1s; padding:6px 2px; }
  .rb:hover:not(.taken) { background:var(--gold-bg); border-color:var(--gold-border); transform:translateY(-2px); }
  .rb:hover:not(.taken) .rb-num { color:var(--gold); }
  .rb.taken { opacity:.25; cursor:default; }
  .rb-num { font-family:'Oswald',sans-serif; font-size:20px; font-weight:700; color:var(--text); letter-spacing:0.04em; }
  .rb-thumb { width:100%; aspect-ratio:1; object-fit:cover; border-radius:4px; display:block; }
  .rb-free { font-size:10px; color:var(--text3); }
  .placed-list { padding-top:1rem; border-top:1px solid rgba(255,255,255,0.05); }
  .placed-row { display:flex; align-items:center; gap:8px; margin-bottom:6px; font-size:12px; color:var(--text3); }
  .placed-row .pr-num { font-family:'Oswald',sans-serif; font-size:12px; font-weight:600; color:var(--gold-dim); width:18px; text-align:right; flex-shrink:0; }
  .placed-row img { width:24px; height:24px; object-fit:cover; border-radius:3px; flex-shrink:0; }
  .fi { animation:fi .22s ease; }
  @keyframes fi { from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);} }

  /* result rows */
  .result-grid { display:flex; flex-direction:column; gap:6px; margin-bottom:1.25rem; }
  .res-row { display:flex; align-items:center; gap:12px; background:var(--surface2); border:1px solid rgba(255,255,255,0.05); border-radius:var(--radius); padding:10px 12px; }
  .res-row.top1 { background:rgba(212,168,67,0.08); border-color:rgba(212,168,67,0.3); }
  .medal-wrap { width:32px; height:32px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-family:'Oswald',sans-serif; font-size:14px; font-weight:700; }
  .m1{background:var(--gold);color:#0c0e14;} .m2{background:#6e7280;color:#fff;} .m3{background:#8c5a32;color:#fff;} .mn{background:var(--surface3);color:var(--text3);}
  .res-img { width:44px; height:44px; object-fit:cover; border-radius:6px; flex-shrink:0; }
  .tg { display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.1em; padding:4px 12px; border-radius:99px; background:rgba(212,168,67,0.12); color:var(--gold); border:1px solid rgba(212,168,67,0.3); margin-bottom:12px; }
  .br { display:flex; gap:8px; flex-wrap:wrap; margin-top:1.5rem; }

  /* submit form */
  .submit-box { background:var(--surface2); border:1px solid rgba(255,255,255,0.06); border-radius:var(--radius-lg); padding:1.25rem 1.5rem; margin-top:1.5rem; }
  .submit-box .sb-title { font-size:13px; font-weight:600; color:var(--text); margin-bottom:.75rem; }
  .submit-row { display:flex; gap:8px; }
  .submit-row input { flex:1; }

  /* personal result card */
  .result-card { background:var(--surface2); border:1px solid rgba(212,168,67,0.2); border-radius:var(--radius-lg); overflow:hidden; }
  .result-card-header { background:var(--gold-bg); border-bottom:1px solid rgba(212,168,67,0.15); padding:1rem 1.25rem; }
  .result-card-header .rc-name { font-size:13px; color:var(--gold-dim); margin-bottom:2px; font-weight:600; }
  .result-card-header .rc-title { font-family:'Oswald',sans-serif; font-size:20px; font-weight:700; color:var(--text); text-transform:uppercase; letter-spacing:0.03em; }
  .result-card-body { padding:1rem 1.25rem; }

  /* group results */
  .group-submission { background:var(--surface2); border:1px solid rgba(255,255,255,0.06); border-radius:var(--radius-lg); padding:1rem 1.25rem; margin-bottom:8px; }
  .group-submission .gs-name { font-size:13px; font-weight:600; color:var(--text); margin-bottom:.5rem; display:flex; align-items:center; gap:8px; }
  .gs-items { display:flex; flex-wrap:wrap; gap:6px; }
  .gs-item { font-size:12px; color:var(--text2); background:var(--surface3); border-radius:4px; padding:3px 8px; display:flex; align-items:center; gap:4px; }
  .gs-rank { font-family:'Oswald',sans-serif; font-size:11px; color:var(--gold-dim); }
  .agg-row { display:flex; align-items:center; gap:10px; padding:10px 12px; margin-bottom:6px; background:var(--surface2); border:1px solid rgba(255,255,255,0.05); border-radius:var(--radius); }
  .agg-rank { font-family:'Oswald',sans-serif; font-size:18px; font-weight:700; color:var(--gold-dim); width:28px; text-align:center; flex-shrink:0; }
  .agg-label { flex:1; font-size:14px; color:var(--text); }
  .agg-score { font-size:11px; color:var(--text3); white-space:nowrap; }
  .agg-img { width:40px; height:40px; object-fit:cover; border-radius:4px; flex-shrink:0; }
  .stat-row { display:flex; gap:12px; margin-bottom:1.5rem; }
  .stat-box { flex:1; background:var(--surface2); border-radius:var(--radius); padding:.75rem; text-align:center; }
  .stat-num { font-family:'Oswald',sans-serif; font-size:24px; font-weight:700; color:var(--gold); }
  .stat-lbl { font-size:11px; color:var(--text3); margin-top:2px; }

  /* MOBILE RESPONSIVENESS */
  @media (max-width: 600px) {
    body { padding: 0; }
    .stage { max-width: 100%; }
    .stage::before { border-radius: 0; }
    .card { border-left: none; border-right: none; border-top: none; border-bottom: none; border-radius: 0; padding: 1.25rem 1rem 3rem; min-height: 100vh; }
    
    /* Result list compacting - ERSTENS: SEHR KLEIN FÜR MOBILE! */
    .result-grid { gap: 4px; margin-bottom: 1rem; }
    .res-row, .agg-row { padding: 6px 8px!important; gap: 8px!important; }
    .res-img, .agg-img { width: 24px!important; height: 24px!important; border-radius: 3px; }
    .medal-wrap { width: 24px!important; height: 24px!important; font-size: 11px!important; }
    .agg-rank { width: 20px!important; font-size: 14px!important; }
    .res-row span, .agg-label { font-size: 13px!important; }
    .agg-score { font-size: 10px!important; }

    /* Intro / Headers */
    h1 { font-size: 20px; }
    .crown { font-size: 18px; }
    .sub { margin-bottom: 1rem; font-size: 11px; }
    
    /* Submit box */
    .submit-box { padding: 0.8rem 1rem; margin-top: 0.75rem; }
    .submit-box .sb-title { margin-bottom: 0.5rem; font-size: 12px; }
    .submit-row input { height: 36px; font-size: 13px; padding: 0 10px; }
    .btn-primary { padding: 0 14px!important; height: 36px; font-size: 12px!important; }
    
    /* Group items */
    .gs-items { gap: 4px; }
    .gs-item { padding: 2px 5px; font-size: 10px; }
    .group-submission { padding: 0.75rem; margin-bottom: 6px; }
    
    /* General buttons */
    button { padding: 8px 14px; font-size: 12px; }
  }
</style>
</head>

function t(key, arg){ 
  const v = T[LANG][key]; 
  return typeof v === 'function' ? v(arg) : v; 
}

// ── HELPERS ───────────────────────────────────────────────────────────
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
function fmtDate(ts){return new Date(ts).toLocaleDateString(t('dateLocale'),{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}

function compressImage(file){
  return new Promise(resolve=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      URL.revokeObjectURL(url);
      if(!img.width||!img.height){resolve(null);return;}
      try{
        let w=img.width, h=img.height;
        const MAX = 600; 
        if(w>h){if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}}else{if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}}
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        let dataUrl=cv.toDataURL('image/jpeg', 0.6); 
        resolve(dataUrl);
      }catch(e){resolve(null);}
    };
    img.onerror=()=>{URL.revokeObjectURL(url);resolve(null);};
    img.src=url;
  });
}

function dataURLtoBlob(dataurl) {
  var arr = dataurl.split(','), mime = arr[0].match(/:(.*?);/)[1],
      bstr = atob(arr[1]), n = bstr.length, u8arr = new Uint8Array(n);
  while(n--){ u8arr[n] = bstr.charCodeAt(n); }
  return new Blob([u8arr], {type:mime});
}

// ── ROBUSTE COPY FUNKTION ──────────────────────────────────────────────
function copyBtn(el,text){
  el.onclick=async()=>{
    let ok=false;
    if(navigator.clipboard && window.isSecureContext) {
      try{ await navigator.clipboard.writeText(text); ok=true; }catch(e){}
    }
    if(!ok){
      try{
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select(); document.execCommand('copy');
        document.body.removeChild(ta);
      }catch(e2){}
    }
    const origHtml = el.innerHTML;
    el.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> ${t('copied')}`;
    el.classList.add('copied');
    setTimeout(()=>{el.innerHTML=origHtml;el.classList.remove('copied');},2500);
  };
}

function linkSection(lbl,url,extra){
  const id='ls'+Math.random().toString(36).slice(2);
  setTimeout(()=>{
    const btn=document.getElementById(id);
    if(btn){
      copyBtn(btn,url);
      const disp=btn.previousElementSibling;
      if(disp){
        disp.title=t('copy');
        disp.onclick=()=>btn.click();
      }
    }
  },50);
  return `<div class="link-section">${extra||''}<div class="lbl">${lbl}</div><div class="url-row"><div class="url-display">${esc(url)}</div><button class="copy-btn" id="${id}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> <span>${t('copy')}</span></button></div></div>`;
}

function initTextCreator(maxItems){
  pageRerender=()=>initTextCreator(maxItems);

  const items=Array(maxItems).fill('');
  
  const linkIconSvg = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>`;

  app.innerHTML=`
    <button class="back-btn" id="back">${t('back')}</button>
    <div class="brand"><span class="crown">🏆</span><h1>${t('textCreatorTitle')}</h1></div>
    <p class="desc">${t('textCreatorDesc')}</p>
    <div class="field"><label>${t('titleLabel')}</label><input type="text" id="title" placeholder="${t('titlePlaceholder')}"/></div>
    <div class="field">
      <label>${t('itemsLabel')} <span id="count" style="opacity:.4">(${maxItems}/${maxItems})</span></label>
      <div id="items-list"></div>
      <button class="btn-sm" id="add-btn" style="margin-top:8px;">${t('addItem')}</button>
    </div>
    <hr class="divider">
    <button class="btn-primary" id="gen-btn" disabled>${linkIconSvg} <span>${t('createLinks')}</span></button>
    <div class="err-box" id="err-box"></div>
    <div class="link-box" id="link-box"></div>`;
  
  document.getElementById('back').onclick=()=>chooseCount('text');

  function renderItems(){
    const list=document.getElementById('items-list');list.innerHTML='';
    items.forEach((val,i)=>{
      const row=document.createElement('div');row.className='item-row';
      row.innerHTML=`<span class="num">${i+1}</span><input type="text" placeholder="${t('itemsLabel')} ${i+1}" value="${esc(val)}" data-idx="${i}" class="iinp">${items.length>2?`<button data-idx="${i}" class="rm-btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>`:''}`;
      list.appendChild(row);
    });
    document.getElementById('count').textContent=`(${items.length}/${maxItems})`;
    document.getElementById('add-btn').style.display=items.length>=maxItems?'none':'';
    list.querySelectorAll('.iinp').forEach(el=>el.addEventListener('input',e=>{items[+e.target.dataset.idx]=e.target.value;chk();}));
    list.querySelectorAll('.rm-btn').forEach(el=>el.addEventListener('click',function() {items.splice(+this.dataset.idx,1);renderItems();chk();}));
  }
  
  function chk(){
    const tv=document.getElementById('title').value.trim();
    document.getElementById('gen-btn').disabled=!(tv&&items.filter(s=>s.trim()).length>=2);
  }
  document.getElementById('title').addEventListener('input',chk);
  document.getElementById('add-btn').addEventListener('click',()=>{if(items.length<maxItems){items.push('');renderItems();chk();}});

  document.getElementById('gen-btn').addEventListener('click',async()=>{
    const title=document.getElementById('title').value.trim();
    const validItems=items.filter(s=>s.trim());
    const btn=document.getElementById('gen-btn'),errBox=document.getElementById('err-box');
    
    if(!checkSupabase(errBox)) return;

    btn.disabled=true;btn.innerHTML=`<span class="spinner"></span> <span>${t('creating')}</span>`;
    errBox.style.display='none';
    
    try {
      const { data: ranking, error } = await sb.from('rankings').insert({ title: title, type: 'text', language: LANG }).select().single();
      if(error) throw error;

      const dbItems = validItems.map((label, index) => ({ ranking_id: ranking.id, position: index + 1, label: label, image_url: null }));
      const { error: itemError } = await sb.from('ranking_items').insert(dbItems);
      if(itemError) throw itemError;

      const base = location.origin + location.pathname;
      const playLink = `${base}?r=${ranking.id}`;
      const resultsLink = `${base}?results=${ranking.id}`;
      const intro = t('aiDefault', validItems.length);

      const linkBox = document.getElementById('link-box');
      linkBox.innerHTML = `
        ${linkSection(t('playLinkLabel'), playLink, `<div style="font-family:'Oswald',sans-serif;font-size:18px;font-weight:700;color:var(--text);margin-bottom:4px;text-transform:uppercase">${esc(title)}</div><div style="font-size:13px;color:var(--text2);margin-bottom:.75rem">${intro}</div>`)}
        <div class="sep"></div>
        ${linkSection(t('groupLinkLabel'), resultsLink)}
      `;
      linkBox.style.display='block';

    } catch(e) {
      errBox.textContent='❌ '+e.message; errBox.style.display='block';
    } finally {
      btn.disabled=false; btn.innerHTML=`${linkIconSvg} <span>${t('createLinks')}</span>`;
    }
  });
  renderItems();
}

function initImageCreator(slotCount){
  pageRerender=()=>initImageCreator(slotCount);
  const app=document.getElementById('app');
  const slots=Array(slotCount).fill(null).map(()=>({img:null, label:'', fileBlob: null}));
  
  const linkIconSvg = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>`;

  app.innerHTML=`
    <button class="back-btn" id="back">${t('back')}</button>
    <div class="brand"><span class="crown">🏆</span><h1>${t('imgCreatorTitle')}</h1></div>
    <p class="desc">${t('imgCreatorDesc')}</p>
    <div class="field"><label>${t('titleLabel')}</label><input type="text" id="title" placeholder="${t('imgTitlePlaceholder')}"/></div>
    <div class="field">
      <label>${t('imagesLabel')} <span id="slot-count" style="opacity:.4">(0/${slotCount})</span></label>
      <div class="slots-grid" id="slots-grid"></div>
    </div>
    <hr class="divider">
    <button class="btn-primary" id="gen-btn" disabled>${linkIconSvg} <span>${t('createLinks')}</span></button>
    <div class="err-box" id="err-box"></div>
    <div class="link-box" id="link-box"></div>`;
    
  document.getElementById('back').onclick=()=>chooseCount('image');

  function renderSlots(){
    const grid=document.getElementById('slots-grid');grid.innerHTML='';
    slots.forEach((s,i)=>{
      const div=document.createElement('div');div.className='slot'+(s.img?' filled':'');
      if(s.img){
        div.innerHTML=`<img src="${s.img}" alt="${t('imgSlotLabel')} ${i+1}"><div class="label-overlay"><input type="text" class="label-input" placeholder="${t('imgLabelPlaceholder')}" value="${esc(s.label)}" data-lidx="${i}"></div><button class="remove-btn" data-ridx="${i}">✕</button>`;
      } else {
        div.innerHTML=`<div class="plus">＋</div><div class="slot-num">${t('imgSlotLabel')} ${i+1}</div>`;
        div.addEventListener('click',()=>openPicker(i));
      }
      div.addEventListener('dragover', e => { e.preventDefault(); div.classList.add('drag-over'); });
      div.addEventListener('dragleave', () => { div.classList.remove('drag-over'); });
      div.addEventListener('drop', async e => {
        e.preventDefault();
        div.classList.remove('drag-over');
        const f=e.dataTransfer.files[0];
        if(f&&f.type.startsWith('image/')){
          const compressed = await compressImage(f);
          if(compressed){ slots[i].img=compressed; slots[i].fileBlob = dataURLtoBlob(compressed); renderSlots(); chk(); }
        }
      });
      grid.appendChild(div);
    });
    grid.querySelectorAll('.label-input').forEach(el=>el.addEventListener('input',e=>{slots[+e.target.dataset.lidx].label=e.target.value;}));
    grid.querySelectorAll('.remove-btn').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();slots[+el.dataset.ridx].img=null;slots[+el.dataset.ridx].fileBlob=null;slots[+el.dataset.ridx].label='';renderSlots();chk();}));
    document.getElementById('slot-count').textContent=`(${slots.filter(s=>s.img).length}/${slotCount})`;
  }

  function openPicker(idx){
    const inp=document.createElement('input');
    inp.type='file';inp.accept='image/*';inp.style.cssText='position:fixed;top:-9999px;opacity:0';
    document.body.appendChild(inp);
    inp.onchange=async()=>{
      const f=inp.files[0];
      try{document.body.removeChild(inp);}catch(e){}
      if(f){
        const compressed = await compressImage(f);
        if(compressed){ slots[idx].img=compressed; slots[idx].fileBlob = dataURLtoBlob(compressed); renderSlots(); chk(); }
      }
    };
    setTimeout(()=>inp.click(),10);
  }

  function chk(){
    const tv=document.getElementById('title').value.trim();
    document.getElementById('gen-btn').disabled=!(tv&&slots.filter(s=>s.img).length>=2);
  }
  document.getElementById('title').addEventListener('input',chk);

  document.getElementById('gen-btn').addEventListener('click',async()=>{
    const title=document.getElementById('title').value.trim();
    const filledItems=slots.filter(s=>s.img);
    const btn=document.getElementById('gen-btn'), errBox=document.getElementById('err-box');
    
    if(!checkSupabase(errBox)) return;

    btn.disabled=true;btn.innerHTML=`<span class="spinner"></span> <span>${t('creating')}</span>`;
    errBox.style.display='none';
    
    try{
      const { data: ranking, error } = await sb.from('rankings').insert({ title: title, type: 'image', language: LANG }).select().single();
      if(error) throw error;

      const dbItems = [];
      for(let i=0; i<filledItems.length; i++){
        const item = filledItems[i];
        const randomString = Math.random().toString(36).substring(2) + Date.now().toString(36);
        const fileName = randomString + '.jpg';
        
        const { error: uploadErr } = await sb.storage.from('ranking-images').upload(fileName, item.fileBlob);
        if(uploadErr) throw uploadErr;
        
        const { data: urlData } = sb.storage.from('ranking-images').getPublicUrl(fileName);
        dbItems.push({ ranking_id: ranking.id, position: i + 1, label: item.label.trim(), image_url: urlData.publicUrl });
      }

      const { error: itemError } = await sb.from('ranking_items').insert(dbItems);
      if(itemError) throw itemError;

      const base = location.origin + location.pathname;
      const playLink = `${base}?r=${ranking.id}`;
      const resultsLink = `${base}?results=${ranking.id}`;
      const intro = t('aiDefaultImg', filledItems.length);

      const linkBox = document.getElementById('link-box');
      linkBox.innerHTML = `
        ${linkSection(t('playLinkLabel'), playLink, `<div style="font-family:'Oswald',sans-serif;font-size:18px;font-weight:700;color:var(--text);margin-bottom:4px;text-transform:uppercase">${esc(title)}</div><div style="font-size:13px;color:var(--text2);margin-bottom:.75rem">${intro}</div>`)}
        <div class="sep"></div>
        ${linkSection(t('groupLinkLabel'), resultsLink)}
      `;
      linkBox.style.display='block';

    }catch(e){
      errBox.textContent='❌ '+e.message; errBox.style.display='block';
    }finally{
      btn.disabled=false; btn.innerHTML=`${linkIconSvg} <span>${t('createLinks')}</span>`;
    }
  });
  renderSlots();
}

// ════════════════════════════════════════════════════════════════════
// GAME LOOP
// ════════════════════════════════════════════════════════════════════
async function initGame(id){
  const app=document.getElementById('app');
  if(!sb) {
    app.innerHTML=`<div style="padding:2rem;text-align:center;color:#e07070">❌ Datenbank blockiert. Bitte Adblocker deaktivieren.</div>`;
    return;
  }
  
  app.innerHTML=`<div class="loading-screen"><span class="spinner spinner-light sp"></span><p>${t('loading')}</p></div>`;
  
  try {
    const { data: ranking, error: rErr } = await sb.from('rankings').select('*').eq('id', id).single();
    if(rErr) throw rErr;
    if(ranking.language) LANG = ranking.language;

    const { data: items, error: iErr } = await sb.from('ranking_items').select('*').eq('ranking_id', id).order('position');
    if(iErr) throw iErr;

    playGame(ranking, items);
  } catch(e) {
    app.innerHTML=`<p style="color:var(--text2);padding:1rem">${t('errLoad')}</p>`;
  }
}

function playGame(ranking, items){
  const app=document.getElementById('app');
  const introText = ranking.type === 'text' ? t('aiDefault', items.length) : t('aiDefaultImg', items.length);
  const st = { view:'start', q: shuffle(items), i: 0, sl: {}, tot: items.length };
  
  function render(){ if(st.view==='start') rStart(); else if(st.view==='rank') rRank(); else rResult(); }
  
  function rStart(){
    app.innerHTML=`<div class="brand" style="margin-bottom:.4rem"><span class="crown">🏆</span><h1>${esc(ranking.title)}</h1></div><p class="sub">${t('blindRanking')} · ${st.tot} ${ranking.type==='text'?t('items'):t('images')}</p><div class="intro-box">${introText}</div><button class="btn-primary" id="sb">${t('startBtn')}</button>`;
    document.getElementById('sb').onclick=()=>{st.view='rank';render();};
  }
  
  function rRank(){
    const cur=st.q[st.i], rem=st.tot-st.i-1, pct=Math.round((st.i/st.tot)*100);
    const taken=Object.keys(st.sl).map(Number).sort((a,b)=>a-b);
    
    let displayArea = '';
    if(ranking.type === 'text') {
      displayArea = `<div class="ic fi"><div class="lb">${t('currentItem')}</div><div class="nm">${esc(cur.label)}</div><div class="ht">${rem===0?t('lastItem'):t('moreItems',rem)}</div></div>`;
    } else {
      displayArea = `<div class="img-card fi"><div class="img-wrap"><img src="${cur.image_url}" alt=""></div>${cur.label?`<div class="img-label">${esc(cur.label)}</div>`:''}<div class="img-hint">${rem===0?t('lastImage'):t('moreImages',rem)}</div></div>`;
    }

    let gridArea = '';
    if(ranking.type === 'text'){
      gridArea = `<div class="sg" id="sg"></div>${taken.length>0?'<div style="padding-top:1rem;border-top:1px solid rgba(255,255,255,0.05)"><div class="hi">'+taken.map(r=>'<strong>#'+r+'</strong> '+esc(st.sl[r].label)).join(' · ')+'</div></div>':''}`;
    } else {
      gridArea = `<div class="rank-row" id="rr"></div>${taken.length>0?'<div class="placed-list" id="pl"></div>':''}`;
    }

    app.innerHTML=`<div class="pw"><div class="pb"><div class="pf" style="width:${pct}%"></div></div><span class="pl">${st.i+1}/${st.tot}</span></div>${displayArea}<div class="sl">${t('whichPlace')}</div>${gridArea}`;

    if(ranking.type === 'text'){
      const g=document.getElementById('sg');
      for(let r=1;r<=st.tot;r++){
        const tk=st.sl[r]!==undefined, el=document.createElement('div');
        el.className='s'+(tk?' tk':'');
        el.innerHTML=tk?`<div class="rk">${r}</div><div class="sn" title="${esc(st.sl[r].label)}">${esc(st.sl[r].label)}</div>`:`<div class="rk">${r}</div><div class="fr">${t('free')}</div>`;
        if(!tk) el.onclick=()=>place(cur,r);
        g.appendChild(el);
      }
    } else {
      const row=document.getElementById('rr');
      for(let r=1;r<=st.tot;r++){
        const tk=st.sl[r]!==undefined, btn=document.createElement('div');
        btn.className='rb'+(tk?' taken':'');
        btn.innerHTML=tk?`<img class="rb-thumb" src="${st.sl[r].image_url}" alt=""><div class="rb-num">${r}</div>`:`<div class="rb-num">${r}</div><div class="rb-free">${t('free')}</div>`;
        if(!tk) btn.onclick=()=>place(cur,r);
        row.appendChild(btn);
      }
      const pl=document.getElementById('pl');
      if(pl) taken.forEach(r=>{
        const row=document.createElement('div'); row.className='placed-row';
        const stLabel = st.sl[r].label ? st.sl[r].label : '–';
        row.innerHTML=`<span class="pr-num">#${r}</span><img src="${st.sl[r].image_url}" alt=""><span>${esc(stLabel)}</span>`;
        pl.appendChild(row);
      });
    }
  }
  
  function place(item,rank){ st.sl[rank]=item; st.i++; if(st.i>=st.tot) st.view='result'; render(); }
  
  function rResult(){
    const ordered = [];
    for(let r=1; r<=st.tot; r++) ordered.push(st.sl[r]);

    const mc={0:'m1',1:'m2',2:'m3'};
    const rows = ordered.map((item, i)=>{
      const imgHTML = item.image_url ? `<img class="res-img" src="${item.image_url}" alt="">` : '';
      const lbl = item.label ? item.label : `${t('imgSlotLabel')} ${i+1}`;
      return `<div class="res-row${i===0?' top1':''}"><div class="medal-wrap ${mc[i]||'mn'}">${i+1}</div>${imgHTML}<span style="font-size:14px;color:var(--text)">${esc(lbl)}</span></div>`;
    }).join('');

    app.innerHTML=`
      <span class="tg">★ ${t('done').replace('★ ','')}</span>
      <div class="brand" style="margin-bottom:.3rem"><span class="crown">🏆</span><h1>${esc(ranking.title)}</h1></div>
      <p class="sub" style="margin-bottom:1.25rem">${t('yourResult')}</p>
      <div class="result-grid">${rows}</div>
      <div class="submit-box" id="submit-box">
        <div class="sb-title">${t('submitShare')}</div>
        <div class="submit-row">
          <input type="text" id="player-name" placeholder="${t('namePlaceholder')}">
          <button class="btn-primary" id="submit-btn">${t('submit')}</button>
        </div>
      </div>
      <div class="br"><button id="rb">${t('playAgain')}</button></div>`;

    document.getElementById('rb').onclick=()=>{st.q=shuffle(items); st.i=0; st.sl={}; st.view='start'; render();};

    document.getElementById('submit-btn').addEventListener('click',async()=>{
      const name = document.getElementById('player-name').value.trim() || t('anon');
      const btn = document.getElementById('submit-btn');
      btn.disabled=true; btn.innerHTML='<span class="spinner"></span>';
      
      try {
        const { data: submission, error: subErr } = await sb.from('submissions').insert({ ranking_id: ranking.id, player_name: name }).select().single();
        if(subErr) throw subErr;

        const subItems = ordered.map((item, index) => ({ submission_id: submission.id, item_label: item.label, rank_position: index + 1, image_url: item.image_url }));
        const { error: itemErr } = await sb.from('submission_items').insert(subItems);
        if(itemErr) throw itemErr;

        const personalURL = `${location.origin}${location.pathname}?result=${submission.id}`;
        const groupURL = `${location.origin}${location.pathname}?results=${ranking.id}`;
        
        document.getElementById('submit-box').outerHTML=`
          <div class="link-box" style="display:block" id="share-links">
            ${linkSection(t('shareMyResult'), personalURL, `<div style="font-size:13px;color:var(--text2);margin-bottom:.75rem">${t('shareResultDesc')}</div>`)}
            <div class="sep"></div>
            ${linkSection(t('seeAllResults'), groupURL)}
          </div>`;
          
      } catch(e) {
        btn.disabled=false; btn.innerHTML=t('submit'); alert(e.message);
      }
    });
  }
  
  pageRerender=render;
  render();
}

// ════════════════════════════════════════════════════════════════════
// PERSONAL RESULT (Einzelnes Ergebnis anzeigen)
// ════════════════════════════════════════════════════════════════════
function initPersonalResult(id){
  pageRerender=()=>initPersonalResult(id);
  const app=document.getElementById('app');
  if(!sb) {
    app.innerHTML=`<div style="padding:2rem;text-align:center;color:#e07070">❌ Datenbank blockiert. Bitte Adblocker deaktivieren.</div>`;
    return;
  }
  
  app.innerHTML=`<div class="loading-screen"><span class="spinner spinner-light sp"></span><p>${t('loadingResult')}</p></div>`;
  
  async function load() {
    try {
      const { data: sub, error: subErr } = await sb
        .from('submissions')
        .select('player_name, created_at, ranking_id, submission_items(item_label, rank_position, image_url)')
        .eq('id', id)
        .single();
        
      if(subErr) throw subErr;

      const { data: rank, error: rankErr } = await sb
        .from('rankings')
        .select('title, language')
        .eq('id', sub.ranking_id)
        .single();
        
      if(rankErr) throw rankErr;

      if(rank.language) LANG = rank.language;

      const items = sub.submission_items.sort((a,b)=>a.rank_position - b.rank_position);
      const mc={0:'m1',1:'m2',2:'m3'};
      
      const rows = items.map((item, i)=>{
        const imgHTML = item.image_url ? `<img class="res-img" src="${item.image_url}" alt="">` : '';
        const lbl = item.item_label ? item.item_label : `${t('imgSlotLabel')} ${i+1}`;
        return `<div class="res-row${i===0?' top1':''}"><div class="medal-wrap ${mc[i]||'mn'}">${i+1}</div>${imgHTML}<span style="font-size:14px;color:var(--text)">${esc(lbl)}</span></div>`;
      }).join('');

      const playURL = `${location.origin}${location.pathname}?r=${sub.ranking_id}`;

      app.innerHTML=`
        <div class="result-card">
          <div class="result-card-header">
            <div class="rc-name">🏆 ${esc(sub.player_name||t('anon'))}</div>
            <div class="rc-title">${esc(rank.title)}</div>
          </div>
          <div class="result-card-body">
            <div class="result-grid" style="margin-bottom:1rem">${rows}</div>
            <div style="font-size:11px;color:var(--text3)">${fmtDate(sub.created_at)}</div>
          </div>
        </div>
        <div class="br" style="margin-top:1.25rem">
          <button class="btn-primary" id="play-btn">${t('playYourself')}</button>
          <button id="copy-url" class="copy-btn" style="width:auto; background:var(--surface2)!important; color:var(--text)!important; border-color:rgba(255,255,255,0.1)!important;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> <span>${t('copyLink')}</span></button>
        </div>`;
      
      document.getElementById('play-btn').onclick=()=>location.href=playURL;
      copyBtn(document.getElementById('copy-url'), location.href);

    } catch(e) {
      app.innerHTML=`<p style="color:var(--text2);padding:1rem">${t('errResult')}</p>`;
    }
  }
  load();
}

// ════════════════════════════════════════════════════════════════════
// GROUP RESULTS
// ════════════════════════════════════════════════════════════════════
function initGroupResults(id){
  pageRerender=()=>initGroupResults(id);
  const app=document.getElementById('app');
  if(!sb) {
    app.innerHTML=`<div style="padding:2rem;text-align:center;color:#e07070">❌ Datenbank blockiert. Bitte Adblocker deaktivieren.</div>`;
    return;
  }
  
  async function load(){
    app.innerHTML=`<div class="loading-screen"><span class="spinner spinner-light sp"></span><p>${t('loadingGroup')}</p></div>`;
    
    try {
      const { data: ranking } = await sb.from('rankings').select('*').eq('id', id).single();
      if(ranking && ranking.language) LANG = ranking.language;

      const { data: submissions, error } = await sb.from('submissions').select(`id, player_name, created_at, submission_items(item_label, rank_position, image_url)`).eq('ranking_id', id).order('created_at', { ascending: false });
      if(error) throw error;

      if(submissions.length === 0){
        app.innerHTML=`<div class="brand"><span class="crown">🏆</span><h1>${t('groupTitle')}</h1></div><p style="color:var(--text2);font-size:14px;margin-top:1rem">${t('noSubs')}</p><div class="br" style="margin-top:1.5rem"><button id="ref">${t('refresh')}</button></div>`;
        document.getElementById('ref').onclick=load; return;
      }

      const itemStats = {};
      submissions.forEach(sub => {
        sub.submission_items.forEach(item => {
          const key = item.item_label || item.image_url || 'Item';
          if(!itemStats[key]) itemStats[key] = { label: item.item_label, img: item.image_url, total: 0, count: 0 };
          itemStats[key].total += item.rank_position;
          itemStats[key].count++;
        });
      });

      const agg = Object.values(itemStats).map(v => ({ label: v.label, img: v.img, avg: v.total / v.count, count: v.count })).sort((a,b) => a.avg - b.avg);

      const aggHTML = agg.map((item, i) => {
        const itemLabel = item.label ? item.label : `${t('imgSlotLabel')} ${i+1}`;
        const imgHtml = item.img ? `<img class="agg-img" src="${item.img}">` : '';
        return `
        <div class="agg-row">
          <div class="agg-rank">${i+1}</div>
          ${imgHtml}
          <div class="agg-label">${esc(itemLabel)}</div>
          <div class="agg-score">Ø ${item.avg.toFixed(1)}</div>
        </div>`;
      }).join('');

      const subsHTML = submissions.map(sub => `
        <div class="group-submission">
          <div class="gs-name">👤 ${esc(sub.player_name || t('anon'))} <span style="font-size:11px;color:var(--text3);font-weight:400">${fmtDate(sub.created_at)}</span></div>
          <div class="gs-items">
            ${sub.submission_items.sort((a,b)=>a.rank_position - b.rank_position).map((item, i) => {
              const itemLbl = item.item_label ? item.item_label : `${t('imgSlotLabel')} ${item.rank_position}`;
              return `<span class="gs-item"><span class="gs-rank">#${item.rank_position}</span> ${esc(itemLbl)}</span>`;
            }).join('')}
          </div>
        </div>`).join('');

      const topLabel = agg[0] ? agg[0].label : t('imgSlotLabel');

      app.innerHTML=`
        <div class="brand" style="margin-bottom:.3rem"><span class="crown">🏆</span><h1>${ranking ? esc(ranking.title) : t('groupTitle')}</h1></div>
        <p class="sub" style="margin-bottom:1.25rem">${t('aggregated')}</p>
        <div class="stat-row">
          <div class="stat-box"><div class="stat-num">${submissions.length}</div><div class="stat-lbl">${t('submissions')}</div></div>
          <div class="stat-box"><div class="stat-num" style="font-size:18px">${esc(topLabel||'—').substring(0,14)}</div><div class="stat-lbl">${t('mostChosen')}</div></div>
        </div>
        <div style="margin-bottom:1.5rem">${aggHTML}</div>
        <div class="divider"></div>
        <p class="sub" style="margin-bottom:1rem">${t('allSubs')}</p>
        ${subsHTML}
        <div class="br" style="margin-top:1.5rem"><button id="ref">${t('refresh')}</button></div>`;
      
      document.getElementById('ref').onclick=load;

    } catch(e) {
      app.innerHTML=`<p style="color:var(--text2);padding:1rem">${t('errLoad')}</p>`;
    }
  }
  load();
}
</script>
</body>
