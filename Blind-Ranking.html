  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {

      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    const templateData = JSON.parse(templateEl.textContent);

    const entryId = templateData.entry;

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : {};

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            let totalLen = 0;

              const { done, value } = await reader.read();

              chunks.push(value);

    // fetch that SRI then rejects — the manifest bytes are ours; SRI protects
    // against CDN compromise, not this), and inject the page's own
    // window.__resources + the click interceptor into <head>. slice() rather
    // than replace() keeps us clear of $-pattern substitution.

      // and tear down the wrapper. Non-# links navigate the parent to the
      // anchor's resolved href; #/… routes forward to the parent's hash only
      // when the id is one of this bundle's own pages (author #/… links from
      // an in-page hash router are left to the scroll path so they don't yank
      // the user to the entry page); plain #frag scrolls in place.

              'return;' +
            '}' +
            'e.preventDefault();' +
            'if (h.slice(0, 2) === "#/") {' +
              'var c = h.indexOf(":", 2);' +
              'var pid = c < 0 ? h.slice(2) : h.slice(2, c);' +
              'try { pid = decodeURIComponent(pid); } catch(err) {}' +
              'if (window.__bundler_pages.indexOf(pid) >= 0) { parent.location.hash = h; return; }' +
            '}' +
            'var t = h.length > 1 ? document.getElementById(h.slice(1)) : null;' +
            'if (t) t.scrollIntoView({behavior:"smooth"});' +
            'else scrollTo({top:0, behavior:"smooth"});' +

      // ids) before wrapping — same escape level as every sibling JSON island.

        headContent.split('</' + 'script').join('<\\/' + 'script') +
        '</' + 'script>';

      // would push the parser into quirks mode. DOMParser always emits a <head>

      }

    }

    setStatus('Rendering...');

    if (pageIds.length === 1) {
      // Single page: the pre-crawl render path. Parse the template and swap the
      // root element. Scripts inserted via DOMParser/replaceWith are inert per
      // spec — re-create each with createElement so they execute, awaiting

      // before Babel before text/babel).

        for (const a of old.attributes) s.setAttribute(a.name, a.value);

        // does XHR against the src, but blob:null/ from a file:// origin is
        // silently dropped. Inlining makes it a plain inline babel script,
        // which transformScriptTags handles unconditionally.

          try {
            const r = await fetch(s.src);
            s.textContent = await r.text();
            s.removeAttribute('src');
          } catch (e) {}
        }

        // data blocks per spec: the browser never fetches src and never fires
        // load/error, so awaiting would hang forever.
        const exec = !s.type || s.type === 'module' || /(java|ecma)script/i.test(s.type);
        const p = (s.src && exec) ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
        old.replaceWith(s);

      // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
      // which fired before we swapped the document. Trigger manually if present.
      if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
        window.Babel.transformScriptTags();
      }
      return;
    }

    // Multi-page: render into a full-viewport srcdoc iframe so each page runs
    // in its own realm while staying same-origin with the parent (so asset
    // blob URLs load and parent.location is writable).
    var frame = document.createElement('iframe');
    frame.id = '__bundler_frame';
    frame.setAttribute('style', 'position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff');
    document.body.appendChild(frame);

    function decode(s) {
      try { return decodeURIComponent(s); } catch (e) { return s; }
    }
    function route() {
      var h = (location.hash || '');
      if (h.slice(0, 2) !== '#/') return { id: entryId, anchor: '' };
      h = h.slice(2);
      var i = h.indexOf(':');
      return i < 0 ? { id: decode(h), anchor: '' }
                   : { id: decode(h.slice(0, i)), anchor: decode(h.slice(i + 1)) };
    }

    var current = null;
    var navGen = 0;
    function navigate() {
      var r = route();
      var id = Object.prototype.hasOwnProperty.call(pages, r.id) ? r.id : entryId;
      if (current === id) {
        // Same-page anchor change: the iframe's own hash handles this, so
        // normally we don't reach here. If we do (e.g. a programmatic
        // parent.location.hash change), nudge the iframe.
        var cw = frame.contentWindow;
        if (!cw) return;
        var el = r.anchor && cw.document.getElementById(r.anchor);
        if (el) el.scrollIntoView({ behavior: 'smooth' });
        else cw.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }
      current = id;
      var gen = ++navGen;
      frame.onload = function() {
        // One-shot: an iframe-internal navigation (form submit, page JS
        // location.href=) re-fires onload with the same gen; after that the
        // iframe may be cross-origin, and cw.* access would throw.
        frame.onload = null;
        if (gen !== navGen) return;
        var cw = frame.contentWindow;
        try { cw.document.title && (document.title = cw.document.title); } catch (e) {}
        var splash = document.getElementById('__bundler_thumbnail') ||
                     document.getElementById('__bundler_placeholder');
        if (splash) splash.remove();
        if (loading) loading.remove();
        var el = r.anchor && cw.document.getElementById(r.anchor);
        if (el) el.scrollIntoView();
        else cw.scrollTo(0, 0);
      };
      frame.srcdoc = pages[id];
    }

    navigate();
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

j],r[i]];}return r;}\nfunction fmtDate(ts){return new Date(ts).toLocaleDateString(t('dateLocale'),{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}\n\nfunction compressImage(file){\n  return new Promise(resolve=>{\n    const img=new Image();\n    const url=URL.createObjectURL(file);\n    img.onload=()=>{\n      URL.revokeObjectURL(url);\n      if(!img.width||!img.height){resolve(null);return;}\n      try{\n        let w=img.width, h=img.height;\n        const MAX = 600; \n        if(w>h){if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}}else{if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}}\n        const cv=document.createElement('canvas');cv.width=w;cv.height=h;\n        cv.getContext('2d').drawImage(img,0,0,w,h);\n        let dataUrl=cv.toDataURL('image/jpeg', 0.6); \n        resolve(dataUrl);\n      }catch(e){resolve(null);}\n    };\n    img.onerror=()=>{URL.revokeObjectURL(url);resolve(null);};\n    img.src=url;\n  });\n}\n\nfunction dataURLtoBlob(dataurl) {\n  var arr = dataurl.split(','), mime = arr[0].match(/:(.*?);/)[1],\n      bstr = atob(arr[1]), n = bstr.length, u8arr = new Uint8Array(n);\n  while(n--){ u8arr[n] = bstr.charCodeAt(n); }\n  return new Blob([u8arr], {type:mime});\n}\n\nfunction checkSupabase(errBox) {\n  if (!sb) {\n    errBox.textContent = '❌ Datenbank blockiert. Bitte Adblocker deaktivieren.';\n    errBox.style.display = 'block';\n    return false;\n  }\n  return true;\n}\n\nfunction copyBtn(el,text){\n  el.onclick=async()=>{\n    let ok=false;\n    if(navigator.clipboard && window.isSecureContext) {\n      try{ await navigator.clipboard.writeText(text); ok=true; }catch(e){}\n    }\n    if(!ok){\n      try{\n        const ta = document.createElement('textarea');\n        ta.value = text;\n        ta.style.position = 'fixed'; ta.style.opacity = '0';\n        document.body.appendChild(ta);\n        ta.select(); document.execCommand('copy');\n        document.body.removeChild(ta);\n      }catch(e2){}\n    }\n    const origHtml = el.innerHTML;\n    el.innerHTML = `<svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg> ${t('copied')}`;\n    el.classList.add('copied');\n    setTimeout(()=>{el.innerHTML=origHtml;el.classList.remove('copied');},2500);\n  };\n}\n\nfunction linkSection(lbl,url,extra){\n  const id='ls'+Math.random().toString(36).slice(2);\n  setTimeout(()=>{\n    const btn=document.getElementById(id);\n    if(btn){\n      copyBtn(btn,url);\n      const disp=btn.previousElementSibling;\n      if(disp){\n        disp.title=t('copy');\n        disp.onclick=()=>btn.click();\n      }\n    }\n  },50);\n  return `<div class=\"link-section\">${extra||''}<div class=\"lbl\">${lbl}<\u002Fdiv><div class=\"url-row\"><div class=\"url-display\">${esc(url)}<\u002Fdiv><button class=\"copy-btn\" id=\"${id}\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"><\u002Frect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"><\u002Fpath><\u002Fsvg> <span>${t('copy')}<\u002Fspan><\u002Fbutton><\u002Fdiv><\u002Fdiv>`;\n}\n\n// ── ROUTING & LANG ────────────────────────────────────────────────────\nlet pageRerender = initHome;\n\nfunction initLangBar(){\n  const bar=document.getElementById('lang-bar');\n  if(!bar)return;\n  bar.querySelectorAll('.lb').forEach(b=>b.classList.remove('active'));\n  const active=bar.querySelector('#lb-'+LANG);\n  if(active)active.classList.add('active');\n  \n  document.getElementById('lb-de').onclick=()=>{ \n    LANG='de'; \n    try{ localStorage.setItem('blindranking-lang','de'); }catch(e){} \n    document.getElementById('html-root').lang='de'; \n    initLangBar(); pageRerender(); \n  };\n  \n  document.getElementById('lb-en').onclick=()=>{ \n    LANG='en'; \n    try{ localStorage.setItem('blindranking-lang','en'); }catch(e){} \n    document.getElementById('html-root').lang='en'; \n    initLangBar(); pageRerender(); \n  };\n}\n\nconst P=new URLSearchParams(location.search);\nconst rankingId=P.get('r');\nconst resultsId=P.get('results');\nconst resultId=P.get('result'); \n\nif(rankingId) initGame(rankingId);\nelse if(resultsId) initGroupResults(resultsId);\nelse if(resultId) initPersonalResult(resultId);\nelse initHome();\n\ninitLangBar();\n\n// ════════════════════════════════════════════════════════════════════\n// HOME & MODE SELECTION\n// ════════════════════════════════════════════════════════════════════\nfunction initHome(){\n  pageRerender=initHome;\n  document.getElementById('app').innerHTML=`\n    <div class=\"brand\"><span class=\"crown\">🏆<\u002Fspan><h1>Blind-Ranking<\u002Fh1><\u002Fdiv>\n    <p class=\"desc\">${t('homeDesc')}<\u002Fp>\n    <div class=\"mode-grid\">\n      <div class=\"mode-card\" id=\"mt\"><div class=\"mode-icon\">🔤<\u002Fdiv><div class=\"mode-title\">${t('textTitle')}<\u002Fdiv><div class=\"mode-desc\">${t('textDesc')}<\u002Fdiv><\u002Fdiv>\n      <div class=\"mode-card\" id=\"mi\" style=\"border-color:var(--gold-border);background:var(--gold-bg);\"><div class=\"mode-icon\">🖼️<\u002Fdiv><div class=\"mode-title\">${t('imgTitle')}<\u002Fdiv><div class=\"mode-desc\">${t('imgDesc')}<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>`;\n  document.getElementById('mt').onclick=()=>chooseCount('text');\n  document.getElementById('mi').onclick=()=>chooseCount('image');\n}\n\nfunction chooseCount(type){\n  pageRerender=()=>chooseCount(type);\n  const lbl=type==='text'?t('textTitle')+'-Ranking':t('imgTitle')+'-Ranking';\n  let count = 5;\n\n  document.getElementById('app').innerHTML=`\n    <button class=\"back-btn\" id=\"back\">${t('back')}<\u002Fbutton>\n    <div class=\"brand\"><span class=\"crown\">🏆<\u002Fspan><h1>${lbl}<\u002Fh1><\u002Fdiv>\n    <p class=\"desc\">${t('chooseAmount')}<\u002Fp>\n\n    <div style=\"background:var(--surface2); border:1px solid rgba(255,255,255,0.07); border-radius:var(--radius-lg); padding:2rem 1rem; text-align:center; margin-top:1.5rem; margin-bottom: 1.5rem;\">\n        <div style=\"display:flex; align-items:center; justify-content:center; gap:1.5rem;\">\n            <button id=\"btn-minus\" class=\"rm-btn\" style=\"width:48px; height:48px; font-size:24px; font-weight:300;\">-<\u002Fbutton>\n            <div id=\"count-disp\" style=\"font-family:'Oswald',sans-serif; font-size:48px; font-weight:700; color:var(--text); width:60px; line-height:1;\">${count}<\u002Fdiv>\n            <button id=\"btn-plus\" class=\"rm-btn\" style=\"width:48px; height:48px; font-size:24px; font-weight:300;\">+<\u002Fbutton>\n        <\u002Fdiv>\n    <\u002Fdiv>\n\n    <button class=\"btn-primary\" id=\"btn-continue\" style=\"width:100%; justify-content:center;\">${t('continueBtn')}<\u002Fbutton>\n  `;\n\n  const disp = document.getElementById('count-disp');\n  const btnMinus = document.getElementById('btn-minus');\n  const btnPlus = document.getElementById('btn-plus');\n\n  function updateUI() {\n      disp.textContent = count;\n      disp.style.color = count === 5 || count === 10 ? 'var(--gold)' : 'var(--text)';\n      btnMinus.style.opacity = count <= 5 ? '0.3' : '1';\n      btnMinus.style.cursor = count <= 5 ? 'default' : 'pointer';\n      btnPlus.style.opacity = count >= 10 ? '0.3' : '1';\n      btnPlus.style.cursor = count >= 10 ? 'default' : 'pointer';\n  }\n\n  btnMinus.onclick = () => { if (count > 5) { count--; updateUI(); } };\n  btnPlus.onclick = () => { if (count < 10) { count++; updateUI(); } };\n\n  updateUI();\n\n  document.getElementById('back').onclick=initHome;\n  document.getElementById('btn-continue').onclick=()=>type==='text'?initTextCreator(count):initImageCreator(count);\n}\n\n// ════════════════════════════════════════════════════════════════════\n// TEXT CREATOR\n// ════════════════════════════════════════════════════════════════════\nfunction initTextCreator(maxItems=5){\n  pageRerender=()=>initTextCreator(maxItems);\n  const app=document.getElementById('app');\n  const items=Array(maxItems).fill('');\n  \n  const linkIconSvg = `<svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71\"><\u002Fpath><path d=\"M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71\"><\u002Fpath><\u002Fsvg>`;\n\n  app.innerHTML=`\n    <button class=\"back-btn\" id=\"back\">${t('back')}<\u002Fbutton>\n    <div class=\"brand\"><span class=\"crown\">🏆<\u002Fspan><h1>${t('textCreatorTitle')}<\u002Fh1><\u002Fdiv>\n    <p class=\"desc\">${t('textCreatorDesc')}<\u002Fp>\n    <div class=\"field\"><label>${t('titleLabel')}<\u002Flabel><input type=\"text\" id=\"title\" placeholder=\"${t('titlePlaceholder')}\"/><\u002Fdiv>\n    <div class=\"field\">\n      <label>${t('itemsLabel')} <span id=\"count\" style=\"opacity:.4\">(${maxItems}/${maxItems})<\u002Fspan><\u002Flabel>\n      <div id=\"items-list\"><\u002Fdiv>\n      <button class=\"btn-sm\" id=\"add-btn\" style=\"margin-top:8px;\">${t('addItem')}<\u002Fbutton>\n    <\u002Fdiv>\n    <hr class=\"divider\">\n    <button class=\"btn-primary\" id=\"gen-btn\" disabled>${linkIconSvg} <span>${t('createLinks')}<\u002Fspan><\u002Fbutton>\n    <div class=\"err-box\" id=\"err-box\"><\u002Fdiv>\n    <div class=\"link-box\" id=\"link-box\"><\u002Fdiv>`;\n  \n  document.getElementById('back').onclick=()=>chooseCount('text');\n\n  function renderItems(){\n    const list=document.getElementById('items-list');list.innerHTML='';\n    items.forEach((val,i)=>{\n      const row=document.createElement('div');row.className='item-row';\n      row.innerHTML=`<span class=\"num\">${i+1}<\u002Fspan><input type=\"text\" placeholder=\"${t('itemsLabel')} ${i+1}\" value=\"${esc(val)}\" data-idx=\"${i}\" class=\"iinp\">${items.length>2?`<button data-idx=\"${i}\" class=\"rm-btn\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"18\" y1=\"6\" x2=\"6\" y2=\"18\"><\u002Fline><line x1=\"6\" y1=\"6\" x2=\"18\" y2=\"18\"><\u002Fline><\u002Fsvg><\u002Fbutton>`:''}`;\n      list.appendChild(row);\n    });\n    document.getElementById('count').textContent=`(${items.length}/${maxItems})`;\n    document.getElementById('add-btn').style.display=items.length>=maxItems?'none':'';\n    list.querySelectorAll('.iinp').forEach(el=>el.addEventListener('input',e=>{items[+e.target.dataset.idx]=e.target.value;chk();}));\n    list.querySelectorAll('.rm-btn').forEach(el=>el.addEventListener('click',function() {items.splice(+this.dataset.idx,1);renderItems();chk();}));\n  }\n  \n  function chk(){\n    const tv=document.getElementById('title').value.trim();\n    document.getElementById('gen-btn').disabled=!(tv&&items.filter(s=>s.trim()).length>=2);\n  }\n  document.getElementById('title').addEventListener('input',chk);\n  document.getElementById('add-btn').addEventListener('click',()=>{if(items.length<maxItems){items.push('');renderItems();chk();}});\n\n  document.getElementById('gen-btn').addEventListener('click',async()=>{\n    const title=document.getElementById('title').value.trim();\n    const validItems=items.filter(s=>s.trim());\n    const btn=document.getElementById('gen-btn'),errBox=document.getElementById('err-box');\n    \n    if(!checkSupabase(errBox)) return;\n\n    btn.disabled=true;btn.innerHTML=`<span class=\"spinner\"><\u002Fspan> <span>${t('creating')}<\u002Fspan>`;\n    errBox.style.display='none';\n    \n    try {\n      const { data: ranking, error } = await sb.from('rankings').insert({ title: title, type: 'text', language: LANG }).select().single();\n      if(error) throw error;\n\n      const dbItems = validItems.map((label, index) => ({ ranking_id: ranking.id, position: index + 1, label: label, image_url: null }));\n      const { error: itemError } = await sb.from('ranking_items').insert(dbItems);\n      if(itemError) throw itemError;\n\n      const base = location.origin + location.pathname;\n      const playLink = `${base}?r=${ranking.id}`;\n      const resultsLink = `${base}?results=${ranking.id}`;\n      const intro = t('aiDefault', validItems.length);\n\n      const linkBox = document.getElementById('link-box');\n      linkBox.innerHTML = `\n        ${linkSection(t('playLinkLabel'), playLink, `<div style=\"font-family:'Oswald',sans-serif;font-size:18px;font-weight:700;color:var(--text);margin-bottom:4px;text-transform:uppercase\">${esc(title)}<\u002Fdiv><div style=\"font-size:13px;color:var(--text2);margin-bottom:.75rem\">${intro}<\u002Fdiv>`)}\n        <div class=\"sep\"><\u002Fdiv>\n        ${linkSection(t('groupLinkLabel'), resultsLink)}\n      `;\n      linkBox.style.display='block';\n\n    } catch(e) {\n      errBox.textContent='❌ '+e.message; errBox.style.display='block';\n    } finally {\n      btn.disabled=false; btn.innerHTML=`${linkIconSvg} <span>${t('createLinks')}<\u002Fspan>`;\n    }\n  });\n  renderItems();\n}\n\n// ════════════════════════════════════════════════════════════════════\n// IMAGE CREATOR\n// ════════════════════════════════════════════════════════════════════\nfunction initImageCreator(slotCount=5){\n  pageRerender=()=>initImageCreator(slotCount);\n  const app=document.getElementById('app');\n  const slots=Array(slotCount).fill(null).map(()=>({img:null, label:'', fileBlob: null}));\n  \n  const linkIconSvg = `<svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71\"><\u002Fpath><path d=\"M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71\"><\u002Fpath><\u002Fsvg>`;\n\n  app.innerHTML=`\n    <button class=\"back-btn\" id=\"back\">${t('back')}<\u002Fbutton>\n    <div class=\"brand\"><span class=\"crown\">🏆<\u002Fspan><h1>${t('imgCreatorTitle')}<\u002Fh1><\u002Fdiv>\n    <p class=\"desc\">${t('imgCreatorDesc')}<\u002Fp>\n    <div class=\"field\"><label>${t('titleLabel')}<\u002Flabel><input type=\"text\" id=\"title\" placeholder=\"${t('imgTitlePlaceholder')}\"/><\u002Fdiv>\n    <div class=\"field\">\n      <label>${t('imagesLabel')} <span id=\"slot-count\" style=\"opacity:.4\">(0/${slotCount})<\u002Fspan><\u002Flabel>\n      <button type=\"button\" id=\"upload-all-btn\" class=\"btn-sm\" style=\"margin-bottom:10px;\">📁 Alle Bilder hochladen<\u002Fbutton>\n      <div class=\"slots-grid\" id=\"slots-grid\"><\u002Fdiv>\n    <\u002Fdiv>\n    <hr class=\"divider\">\n    <button class=\"btn-primary\" id=\"gen-btn\" disabled>${linkIconSvg} <span>${t('createLinks')}<\u002Fspan><\u002Fbutton>\n    <div class=\"err-box\" id=\"err-box\"><\u002Fdiv>\n    <div class=\"link-box\" id=\"link-box\"><\u002Fdiv>`;\n    \n  document.getElementById('back').onclick=()=>chooseCount('image');\n\n  function renderSlots(){\n    const grid=document.getElementById('slots-grid');grid.innerHTML='';\n    slots.forEach((s,i)=>{\n      const div=document.createElement('div');div.className='slot'+(s.img?' filled':'');\n      if(s.img){\n        div.innerHTML=`<img src=\"${s.img}\" alt=\"${t('imgSlotLabel')} ${i+1}\"><div class=\"label-overlay\"><input type=\"text\" class=\"label-input\" placeholder=\"${t('imgLabelPlaceholder')}\" value=\"${esc(s.label)}\" data-lidx=\"${i}\"><\u002Fdiv><button class=\"remove-btn\" data-ridx=\"${i}\">✕<\u002Fbutton>`;\n      } else {\n        div.innerHTML=`<div class=\"plus\">＋<\u002Fdiv><div class=\"slot-num\">${t('imgSlotLabel')} ${i+1}<\u002Fdiv>`;\n        div.addEventListener('click',()=>openPicker(i));\n      }\n      div.addEventListener('dragover', e => { e.preventDefault(); div.classList.add('drag-over'); });\n      div.addEventListener('dragleave', () => { div.classList.remove('drag-over'); });\n      div.addEventListener('drop', async e => {\n        e.preventDefault();\n        div.classList.remove('drag-over');\n        const f=e.dataTransfer.files[0];\n        if(f&&f.type.startsWith('image/')){\n          const compressed = await compressImage(f);\n          if(compressed){ slots[i].img=compressed; slots[i].fileBlob = dataURLtoBlob(compressed); renderSlots(); chk(); }\n        }\n      });\n      grid.appendChild(div);\n    });\n    grid.querySelectorAll('.label-input').forEach(el=>el.addEventListener('input',e=>{slots[+e.target.dataset.lidx].label=e.target.value;}));\n    grid.querySelectorAll('.remove-btn').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();slots[+el.dataset.ridx].img=null;slots[+el.dataset.ridx].fileBlob=null;slots[+el.dataset.ridx].label='';renderSlots();chk();}));\n    document.getElementById('slot-count').textContent=`(${slots.filter(s=>s.img).length}/${slotCount})`;\n  }\n\n  function openPicker(idx){\n    const inp=document.createElement('input');\n    inp.type='file';inp.accept='image/*';inp.multiple=true;inp.style.cssText='position:fixed;top:-9999px;opacity:0';\n    document.body.appendChild(inp);\n    inp.onchange=async()=>{\n      const files=Array.from(inp.files||[]);\n      try{document.body.removeChild(inp);}catch(e){}\n      let pos=idx;\n      for(const f of files){\n        while(pos<slots.length && slots[pos].img) pos++;\n        if(pos>=slots.length) break;\n        const compressed=await compressImage(f);\n        if(compressed){\n          slots[pos].img=compressed;\n          slots[pos].fileBlob=dataURLtoBlob(compressed);\n          slots[pos].label=f.name.replace(/\\.[^/.]+$/,'');\n          pos++;\n        }\n      }\n      renderSlots(); chk();\n    };\n    setTimeout(()=>inp.click(),10);\n  }\n\n  function chk(){\n    const tv=document.getElementById('title').value.trim();\n    document.getElementById('gen-btn').disabled=!(tv&&slots.filter(s=>s.img).length>=2);\n  }\n  document.getElementById('title').addEventListener('input',chk);\n\n  document.getElementById('gen-btn').addEventListener('click',async()=>{\n    const title=document.getElementById('title').value.trim();\n    const filledItems=slots.filter(s=>s.img);\n    const btn=document.getElementById('gen-btn'), errBox=document.getElementById('err-box');\n    \n    if(!checkSupabase(errBox)) return;\n\n    btn.disabled=true;btn.innerHTML=`<span class=\"spinner\"><\u002Fspan> <span>${t('creating')}<\u002Fspan>`;\n    errBox.style.display='none';\n    \n    try{\n      const { data: ranking, error } = await sb.from('rankings').insert({ title: title, type: 'image', language: LANG }).select().single();\n      if(error) throw error;\n\n      const dbItems = [];\n      for(let i=0; i<filledItems.length; i++){\n        const item = filledItems[i];\n        const randomString = Math.random().toString(36).substring(2) + Date.now().toString(36);\n        const fileName = randomString + '.jpg';\n        \n        const { error: uploadErr } = await sb.storage.from('ranking-images').upload(fileName, item.fileBlob);\n        if(uploadErr) throw uploadErr;\n        \n        const { data: urlData } = sb.storage.from('ranking-images').getPublicUrl(fileName);\n        dbItems.push({ ranking_id: ranking.id, position: i + 1, label: item.label.trim(), image_url: urlData.publicUrl });\n      }\n\n      const { error: itemError } = await sb.from('ranking_items').insert(dbItems);\n      if(itemError) throw itemError;\n\n      const base = location.origin + location.pathname;\n      const playLink = `${base}?r=${ranking.id}`;\n      const resultsLink = `${base}?results=${ranking.id}`;\n      const intro = t('aiDefaultImg', filledItems.length);\n\n      const linkBox = document.getElementById('link-box');\n      linkBox.innerHTML = `\n        ${linkSection(t('playLinkLabel'), playLink, `<div style=\"font-family:'Oswald',sans-serif;font-size:18px;font-weight:700;color:var(--text);margin-bottom:4px;text-transform:uppercase\">${esc(title)}<\u002Fdiv><div style=\"font-size:13px;color:var(--text2);margin-bottom:.75rem\">${intro}<\u002Fdiv>`)}\n        <div class=\"sep\"><\u002Fdiv>\n        ${linkSection(t('groupLinkLabel'), resultsLink)}\n      `;\n      linkBox.style.display='block';\n\n    }catch(e){\n      errBox.textContent='❌ '+e.message; errBox.style.display='block';\n    }finally{\n      btn.disabled=false; btn.innerHTML=`${linkIconSvg} <span>${t('createLinks')}<\u002Fspan>`;\n    }\n  });\n\n  document.getElementById('upload-all-btn').onclick=()=>openPicker(0);\n\n  renderSlots();\n}\n\n// ════════════════════════════════════════════════════════════════════\n// GAME LOOP\n// ════════════════════════════════════════════════════════════════════\nasync function initGame(id){\n  const app=document.getElementById('app');\n  if(!sb) {\n    app.innerHTML=`<div style=\"padding:2rem;text-align:center;color:#e07070\">❌ Datenbank blockiert. Bitte Adblocker deaktivieren.<\u002Fdiv>`;\n    return;\n  }\n  \n  app.innerHTML=`<div class=\"loading-screen\"><span class=\"spinner spinner-light sp\"><\u002Fspan><p>${t('loading')}<\u002Fp><\u002Fdiv>`;\n  \n  try {\n    const { data: ranking, error: rErr } = await sb.from('rankings').select('*').eq('id', id).single();\n    if(rErr) throw rErr;\n    if(ranking.language) LANG = ranking.language;\n\n    const { data: items, error: iErr } = await sb.from('ranking_items').select('*').eq('ranking_id', id).order('position');\n    if(iErr) throw iErr;\n\n    playGame(ranking, items);\n  } catch(e) {\n    app.innerHTML=`<p style=\"color:var(--text2);padding:1rem\">${t('errLoad')}<\u002Fp>`;\n  }\n}\n\nfunction playGame(ranking, items){\n  const app=document.getElementById('app');\n  const introText = ranking.type === 'text' ? t('aiDefault', items.length) : t('aiDefaultImg', items.length);\n  const st = { view:'start', q: shuffle(items), i: 0, sl: {}, tot: items.length };\n  \n  function render(){ if(st.view==='start') rStart(); else if(st.view==='rank') rRank(); else rResult(); }\n  \n  function rStart(){\n    app.innerHTML=`<div class=\"brand\" style=\"margin-bottom:.4rem\"><span class=\"crown\">🏆<\u002Fspan><h1>${esc(ranking.title)}<\u002Fh1><\u002Fdiv><p class=\"sub\">${t('blindRanking')} · ${st.tot} ${ranking.type==='text'?t('items'):t('images')}<\u002Fp><div class=\"intro-box\">${introText}<\u002Fdiv><button class=\"btn-primary\" id=\"sb\">${t('startBtn')}<\u002Fbutton>`;\n    document.getElementById('sb').onclick=()=>{st.view='rank';render();};\n  }\n  \n  function rRank(){\n    const cur=st.q[st.i], rem=st.tot-st.i-1, pct=Math.round((st.i/st.tot)*100);\n    const taken=Object.keys(st.sl).map(Number).sort((a,b)=>a-b);\n    \n    let displayArea = '';\n    if(ranking.type === 'text') {\n      displayArea = `<div class=\"ic fi\"><div class=\"lb\">${t('currentItem')}<\u002Fdiv><div class=\"nm\">${esc(cur.label)}<\u002Fdiv><div class=\"ht\">${rem===0?t('lastItem'):t('moreItems',rem)}<\u002Fdiv><\u002Fdiv>`;\n    } else {\n      displayArea = `<div class=\"img-card fi\"><div class=\"img-wrap\"><img src=\"${cur.image_url}\" alt=\"\"><\u002Fdiv>${cur.label?`<div class=\"img-label\">${esc(cur.label)}<\u002Fdiv>`:''}<div class=\"img-hint\">${rem===0?t('lastImage'):t('moreImages',rem)}<\u002Fdiv><\u002Fdiv>`;\n    }\n\n    let gridArea = '';\n    if(ranking.type === 'text'){\n      gridArea = `<div class=\"sg\" id=\"sg\"><\u002Fdiv>${taken.length>0?'<div style=\"padding-top:1rem;border-top:1px solid rgba(255,255,255,0.05)\"><div class=\"hi\">'+taken.map(r=>'<strong>#'+r+'<\u002Fstrong> '+esc(st.sl[r].label)).join(' · ')+'<\u002Fdiv><\u002Fdiv>':''}`;\n    } else {\n      gridArea = `<div class=\"rank-row\" id=\"rr\"><\u002Fdiv>${taken.length>0?'<div class=\"placed-list\" id=\"pl\"><\u002Fdiv>':''}`;\n    }\n\n    app.innerHTML=`<div class=\"pw\"><div class=\"pb\"><div class=\"pf\" style=\"width:${pct}%\"><\u002Fdiv><\u002Fdiv><span class=\"pl\">${st.i+1}/${st.tot}<\u002Fspan><\u002Fdiv>${displayArea}<div class=\"sl\">${t('whichPlace')}<\u002Fdiv>${gridArea}`;\n\n    if(ranking.type === 'text'){\n      const g=document.getElementById('sg');\n      for(let r=1;r<=st.tot;r++){\n        const tk=st.sl[r]!==undefined, el=document.createElement('div');\n        el.className='s'+(tk?' tk':'');\n        el.innerHTML=tk?`<div class=\"rk\">${r}<\u002Fdiv><div class=\"sn\" title=\"${esc(st.sl[r].label)}\">${esc(st.sl[r].label)}<\u002Fdiv>`:`<div class=\"rk\">${r}<\u002Fdiv><div class=\"fr\">${t('free')}<\u002Fdiv>`;\n        if(!tk) el.onclick=()=>place(cur,r);\n        g.appendChild(el);\n      }\n    } else {\n      const row=document.getElementById('rr');\n      for(let r=1;r<=st.tot;r++){\n        const tk=st.sl[r]!==undefined, btn=document.createElement('div');\n        btn.className='rb'+(tk?' taken':'');\n        btn.innerHTML=tk?`<img class=\"rb-thumb\" src=\"${st.sl[r].image_url}\" alt=\"\"><div class=\"rb-num\">${r}<\u002Fdiv>`:`<div class=\"rb-num\">${r}<\u002Fdiv><div class=\"rb-free\">${t('free')}<\u002Fdiv>`;\n        if(!tk) btn.onclick=()=>place(cur,r);\n        row.appendChild(btn);\n      }\n      const pl=document.getElementById('pl');\n      if(pl) taken.forEach(r=>{\n        const row=document.createElement('div'); row.className='placed-row';\n        const stLabel = st.sl[r].label ? st.sl[r].label : '–';\n        row.innerHTML=`<span class=\"pr-num\">#${r}<\u002Fspan><img src=\"${st.sl[r].image_url}\" alt=\"\"><span>${esc(stLabel)}<\u002Fspan>`;\n        pl.appendChild(row);\n      });\n    }\n  }\n  \n  function place(item,rank){ st.sl[rank]=item; st.i++; if(st.i>=st.tot) st.view='result'; render(); }\n  \n  function rResult(){\n    const ordered = [];\n    for(let r=1; r<=st.tot; r++) ordered.push(st.sl[r]);\n\n    const mc={0:'m1',1:'m2',2:'m3'};\n    const rows = ordered.map((item, i)=>{\n      const imgHTML = item.image_url ? `<img class=\"res-img\" src=\"${item.image_url}\" alt=\"\">` : '';\n      const lbl = item.label ? item.label : `${t('imgSlotLabel')} ${i+1}`;\n      return `<div class=\"res-row${i===0?' top1':''}\"><div class=\"medal-wrap ${mc[i]||'mn'}\">${i+1}<\u002Fdiv>${imgHTML}<span style=\"font-size:14px;color:var(--text)\">${esc(lbl)}<\u002Fspan><\u002Fdiv>`;\n    }).join('');\n\n    app.innerHTML=`\n      <span class=\"tg\">★ ${t('done').replace('★ ','')}<\u002Fspan>\n      <div class=\"brand\" style=\"margin-bottom:.3rem\"><span class=\"crown\">🏆<\u002Fspan><h1>${esc(ranking.title)}<\u002Fh1><\u002Fdiv>\n      <p class=\"sub\" style=\"margin-bottom:1.25rem\">${t('yourResult')}<\u002Fp>\n      <div class=\"result-grid\">${rows}<\u002Fdiv>\n      <div class=\"submit-box\" id=\"submit-box\">\n        <div class=\"sb-title\">${t('submitShare')}<\u002Fdiv>\n        <div class=\"submit-row\">\n          <input type=\"text\" id=\"player-name\" placeholder=\"${t('namePlaceholder')}\">\n          <button class=\"btn-primary\" id=\"submit-btn\">${t('submit')}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"br\"><button id=\"rb\">${t('playAgain')}<\u002Fbutton><\u002Fdiv>`;\n\n    document.getElementById('rb').onclick=()=>{st.q=shuffle(items); st.i=0; st.sl={}; st.view='start'; render();};\n\n    document.getElementById('submit-btn').addEventListener('click',async()=>{\n      const name = document.getElementById('player-name').value.trim() || t('anon');\n      const btn = document.getElementById('submit-btn');\n      btn.disabled=true; btn.innerHTML='<span class=\"spinner\"><\u002Fspan>';\n      \n      try {\n        const { data: submission, error: subErr } = await sb.from('submissions').insert({ ranking_id: ranking.id, player_name: name }).select().single();\n        if(subErr) throw subErr;\n\n        const subItems = ordered.map((item, index) => ({ submission_id: submission.id, item_label: item.label, rank_position: index + 1, image_url: item.image_url }));\n        const { error: itemErr } = await sb.from('submission_items').insert(subItems);\n        if(itemErr) throw itemErr;\n\n        const personalURL = `${location.origin}${location.pathname}?result=${submission.id}`;\n        const groupURL = `${location.origin}${location.pathname}?results=${ranking.id}`;\n        \n        document.getElementById('submit-box').outerHTML=`\n          <div class=\"link-box\" style=\"display:block\" id=\"share-links\">\n            ${linkSection(t('shareMyResult'), personalURL, `<div style=\"font-size:13px;color:var(--text2);margin-bottom:.75rem\">${t('shareResultDesc')}<\u002Fdiv>`)}\n            <div class=\"sep\"><\u002Fdiv>\n            ${linkSection(t('seeAllResults'), groupURL)}\n          <\u002Fdiv>`;\n          \n      } catch(e) {\n        btn.disabled=false; btn.innerHTML=t('submit'); alert(e.message);\n      }\n    });\n  }\n  \n  pageRerender=render;\n  render();\n}\n\n// ════════════════════════════════════════════════════════════════════\n// PERSONAL RESULT (Einzelnes Ergebnis anzeigen)\n// ════════════════════════════════════════════════════════════════════\nfunction initPersonalResult(id){\n  pageRerender=()=>initPersonalResult(id);\n  const app=document.getElementById('app');\n  if(!sb) {\n    app.innerHTML=`<div style=\"padding:2rem;text-align:center;color:#e07070\">❌ Datenbank blockiert. Bitte Adblocker deaktivieren.<\u002Fdiv>`;\n    return;\n  }\n  \n  app.innerHTML=`<div class=\"loading-screen\"><span class=\"spinner spinner-light sp\"><\u002Fspan><p>${t('loadingResult')}<\u002Fp><\u002Fdiv>`;\n  \n  async function load() {\n    try {\n      const { data: sub, error: subErr } = await sb\n        .from('submissions')\n        .select('player_name, created_at, ranking_id, submission_items(item_label, rank_position, image_url)')\n        .eq('id', id)\n        .single();\n        \n      if(subErr) throw subErr;\n\n      const { data: rank, error: rankErr } = await sb\n        .from('rankings')\n        .select('title, language')\n        .eq('id', sub.ranking_id)\n        .single();\n        \n      if(rankErr) throw rankErr;\n\n      if(rank.language) LANG = rank.language;\n\n      const items = sub.submission_items.sort((a,b)=>a.rank_position - b.rank_position);\n      const mc={0:'m1',1:'m2',2:'m3'};\n      \n      const rows = items.map((item, i)=>{\n        const imgHTML = item.image_url ? `<img class=\"res-img\" src=\"${item.image_url}\" alt=\"\">` : '';\n        const lbl = item.item_label ? item.item_label : `${t('imgSlotLabel')} ${i+1}`;\n        return `<div class=\"res-row${i===0?' top1':''}\"><div class=\"medal-wrap ${mc[i]||'mn'}\">${i+1}<\u002Fdiv>${imgHTML}<span style=\"font-size:14px;color:var(--text)\">${esc(lbl)}<\u002Fspan><\u002Fdiv>`;\n      }).join('');\n\n      const playURL = `${location.origin}${location.pathname}?r=${sub.ranking_id}`;\n\n      app.innerHTML=`\n        <div class=\"result-card\">\n          <div class=\"result-card-header\">\n            <div class=\"rc-name\">🏆 ${esc(sub.player_name||t('anon'))}<\u002Fdiv>\n            <div class=\"rc-title\">${esc(rank.title)}<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"result-card-body\">\n            <div class=\"result-grid\" style=\"margin-bottom:1rem\">${rows}<\u002Fdiv>\n            <div style=\"font-size:11px;color:var(--text3)\">${fmtDate(sub.created_at)}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"br\" style=\"margin-top:1.25rem\">\n          <button class=\"btn-primary\" id=\"play-btn\">${t('playYourself')}<\u002Fbutton>\n          <button id=\"copy-url\" class=\"copy-btn\" style=\"width:auto; background:var(--surface2)!important; color:var(--text)!important; border-color:rgba(255,255,255,0.1)!important;\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\" ry=\"2\"><\u002Frect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"><\u002Fpath><\u002Fsvg> <span>${t('copyLink')}<\u002Fspan><\u002Fbutton>\n        <\u002Fdiv>`;\n      \n      document.getElementById('play-btn').onclick=()=>location.href=playURL;\n      copyBtn(document.getElementById('copy-url'), location.href);\n\n    } catch(e) {\n      app.innerHTML=`<p style=\"color:var(--text2);padding:1rem\">${t('errResult')}<\u002Fp>`;\n    }\n  }\n  load();\n}\n\n// ════════════════════════════════════════════════════════════════════\n// GROUP RESULTS\n// ════════════════════════════════════════════════════════════════════\nfunction initGroupResults(id){\n  pageRerender=()=>initGroupResults(id);\n  const app=document.getElementById('app');\n  if(!sb) {\n    app.innerHTML=`<div style=\"padding:2rem;text-align:center;color:#e07070\">❌ Datenbank blockiert. Bitte Adblocker deaktivieren.<\u002Fdiv>`;\n    return;\n  }\n  \n  async function load(){\n    app.innerHTML=`<div class=\"loading-screen\"><span class=\"spinner spinner-light sp\"><\u002Fspan><p>${t('loadingGroup')}<\u002Fp><\u002Fdiv>`;\n    \n    try {\n      const { data: ranking } = await sb.from('rankings').select('*').eq('id', id).single();\n      if(ranking && ranking.language) LANG = ranking.language;\n\n      const { data: submissions, error } = await sb.from('submissions').select(`id, player_name, created_at, submission_items(item_label, rank_position, image_url)`).eq('ranking_id', id).order('created_at', { ascending: false });\n      if(error) throw error;\n\n      if(submissions.length === 0){\n        app.innerHTML=`<div class=\"brand\"><span class=\"crown\">🏆<\u002Fspan><h1>${t('groupTitle')}<\u002Fh1><\u002Fdiv><p style=\"color:var(--text2);font-size:14px;margin-top:1rem\">${t('noSubs')}<\u002Fp><div class=\"br\" style=\"margin-top:1.5rem\"><button id=\"ref\">${t('refresh')}<\u002Fbutton><\u002Fdiv>`;\n        document.getElementById('ref').onclick=load; return;\n      }\n\n      const itemStats = {};\n      submissions.forEach(sub => {\n        sub.submission_items.forEach(item => {\n          const key = item.item_label || item.image_url || 'Item';\n          if(!itemStats[key]) itemStats[key] = { label: item.item_label, img: item.image_url, total: 0, count: 0 };\n          itemStats[key].total += item.rank_position;\n          itemStats[key].count++;\n        });\n      });\n\n      const agg = Object.values(itemStats).map(v => ({ label: v.label, img: v.img, avg: v.total / v.count, count: v.count })).sort((a,b) => a.avg - b.avg);\n\n      const aggHTML = agg.map((item, i) => {\n        const itemLabel = item.label ? item.label : `${t('imgSlotLabel')} ${i+1}`;\n        const imgHtml = item.img ? `<img class=\"agg-img\" src=\"${item.img}\">` : '';\n        return `\n        <div class=\"agg-row\">\n          <div class=\"agg-rank\">${i+1}<\u002Fdiv>\n          ${imgHtml}\n          <div class=\"agg-label\">${esc(itemLabel)}<\u002Fdiv>\n          <div class=\"agg-score\">Ø ${item.avg.toFixed(1)}<\u002Fdiv>\n        <\u002Fdiv>`;\n      }).join('');\n\n      const subsHTML = submissions.map(sub => `\n        <div class=\"group-submission\">\n          <div class=\"gs-name\">👤 ${esc(sub.player_name || t('anon'))} <span style=\"font-size:11px;color:var(--text3);font-weight:400\">${fmtDate(sub.created_at)}<\u002Fspan><\u002Fdiv>\n          <div class=\"gs-items\">\n            ${sub.submission_items.sort((a,b)=>a.rank_position - b.rank_position).map((item, i) => {\n              const itemLbl = item.item_label ? item.item_label : `${t('imgSlotLabel')} ${item.rank_position}`;\n              return `<span class=\"gs-item\"><span class=\"gs-rank\">#${item.rank_position}<\u002Fspan> ${esc(itemLbl)}<\u002Fspan>`;\n            }).join('')}\n          <\u002Fdiv>\n        <\u002Fdiv>`).join('');\n\n      const topLabel = agg[0] ? agg[0].label : t('imgSlotLabel');\n\n      app.innerHTML=`\n        <div class=\"brand\" style=\"margin-bottom:.3rem\"><span class=\"crown\">🏆<\u002Fspan><h1>${ranking ? esc(ranking.title) : t('groupTitle')}<\u002Fh1><\u002Fdiv>\n        <p class=\"sub\" style=\"margin-bottom:1.25rem\">${t('aggregated')}<\u002Fp>\n        <div class=\"stat-row\">\n          <div class=\"stat-box\"><div class=\"stat-num\">${submissions.length}<\u002Fdiv><div class=\"stat-lbl\">${t('submissions')}<\u002Fdiv><\u002Fdiv>\n          <div class=\"stat-box\"><div class=\"stat-num\" style=\"font-size:18px\">${esc(topLabel||'—').substring(0,14)}<\u002Fdiv><div class=\"stat-lbl\">${t('mostChosen')}<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-bottom:1.5rem\">${aggHTML}<\u002Fdiv>\n        <div class=\"divider\"><\u002Fdiv>\n        <p class=\"sub\" style=\"margin-bottom:1rem\">${t('allSubs')}<\u002Fp>\n        ${subsHTML}\n        <div class=\"br\" style=\"margin-top:1.5rem\"><button id=\"ref\">${t('refresh')}<\u002Fbutton><\u002Fdiv>`;\n      \n      document.getElementById('ref').onclick=load;\n\n    } catch(e) {\n      app.innerHTML=`<p style=\"color:var(--text2);padding:1rem\">${t('errLoad')}<\u002Fp>`;\n    }\n  }\n  load();\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"},"entry":"uploads/index"}
  </script>
